# ═══════════════════════════════════════════════════════════════
#   بناء تطبيق جايك للآيفون — على ماك بالسحابة
#
#   نفس أسلوب تطبيق امواج: Codemagic يأجّر ماك، يبني، ويرفع
#   لـTestFlight لحاله. علي بويندوز فما عندنا ماك محلي.
#
#   ⚠️ كاباسيتور ٨ يستعمل Swift Package Manager مو CocoaPods —
#      يعني ماكو Podfile ولا App.xcworkspace، نبني الـ.xcodeproj.
#
#   🔏 التوقيع أوتوماتيكي بالكامل، من مفتاحين محفوظين بـCodemagic:
#        • مفتاح API (CodemagicAmwajKey) — نفس مفتاح حساب أبل،
#          يشتغل لكل تطبيقات الحساب مو لامواج بس
#        • CERTIFICATE_PRIVATE_KEY — بمجموعة code-signing
#
#      ⚠️ مفتاح الشهادة لازم يبقى نفسه بكل بناء. لو انبدّل يسوي
#         شهادة جديدة، وأبل تسمح بعدد محدود.
#
#   📦 واجهة التطبيق محزومة جوّا التطبيق مو تنفتح من الموقع —
#      وهذا مقصود: أبل ترفض التطبيق اللي مجرد موقع بغلاف.
#      فأي تعديل على الموقع يحتاج بناء جديد ورفعة جديدة.
# ═══════════════════════════════════════════════════════════════

workflows:
  ios-jayak-workflow:
    name: Jayak iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      # الاسم لازم يطابق اسم المفتاح بإعدادات Codemagic
      # (Personal Account ← Settings ← Integrations ← Developer Portal)
      app_store_connect: CodemagicAmwajKey

    environment:
      groups:
        - code-signing          # بيها CERTIFICATE_PRIVATE_KEY
      vars:
        BUNDLE_ID: "com.jayak.app"
        XCODE_PROJECT: "ios-app/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        # ⚠️ بعد ما تسوي التطبيق بـApp Store Connect، خذ رقمه من
        #    (App Information ← Apple ID) وضيفه هنا هيچي:
        #      APP_STORE_APP_ID: "1234567890"
        #    ولا تحطه فاضي "" أبداً — Codemagic يرفض الملف كله.
        #    بدونه البناء يشتغل عادي ويستعمل رقم بناء Codemagic.
      # كاباسيتور ٨ يطلب Node 22 أو أحدث — بـ20 يفشل «cap sync»
      node: lts
      xcode: latest

    scripts:
      - name: تنصيب الحزم
        script: |
          cd "$CM_BUILD_DIR/ios-app"
          npm ci || npm install

      - name: تجهيز الواجهة ومزامنة كاباسيتور
        # نولّد www من صفحات الموقع اللي بجذر المستودع، وبعدين
        # ننسخها لمشروع Xcode ونربط الإضافات.
        script: |
          cd "$CM_BUILD_DIR/ios-app"
          node build-www.js
          npx cap sync ios

      - name: تجهيز سلسلة المفاتيح
        script: |
          keychain initialize

      - name: جلب أو إنشاء شهادة التوقيع وملف التعريف
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: إضافة الشهادة لسلسلة المفاتيح
        script: |
          keychain add-certificates

      - name: ربط التوقيع بمشروع Xcode
        script: |
          xcode-project use-profiles

      - name: رقم البناء
        # كل رفعة لأبل لازم رقم بناء أكبر من اللي قبله.
        script: |
          cd "$CM_BUILD_DIR/ios-app/ios/App"
          if [ -n "${APP_STORE_APP_ID:-}" ]; then
            TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null | tail -1)
            AS=$(app-store-connect get-latest-app-store-build-number  "$APP_STORE_APP_ID" 2>/dev/null | tail -1)
            TF=${TF//[^0-9]/}; AS=${AS//[^0-9]/}
            TF=${TF:-0};       AS=${AS:-0}
            LATEST=$(( TF > AS ? TF : AS ))
            NEXT=$((LATEST + 1))
          else
            NEXT="$PROJECT_BUILD_NUMBER"
          fi
          echo "رقم البناء: $NEXT"
          agvtool new-version -all "$NEXT"

      - name: بناء ملف ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios-app/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - alihusain.2001.d@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        # false مقصود: true يقدّمه لمراجعة «المختبرين الخارجيين»،
        # وهاي تحتاج معلومات اختبار ما عبّيناها بعد فتفشل.
        submit_to_testflight: false
