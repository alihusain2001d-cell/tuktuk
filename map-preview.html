<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>جايك — تجربة الخريطة</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Segoe UI',Tahoma,sans-serif; }
  :root { --ink:#1A1A1A; --sky:#FFC800; --sky-dark:#E0AC00; --line:#EDE7DA; --muted:#8A8270; }
  html,body { height:100%; background:#fff; color:var(--ink); overflow:hidden; }
  #app { height:100vh; display:flex; flex-direction:column; }
  header { background:#fff; padding:11px 16px; box-shadow:0 1px 10px rgba(0,0,0,.08); z-index:500; flex-shrink:0; }
  header h1 { font-size:15.5px; margin-bottom:2px; }
  header p { font-size:11.5px; color:var(--muted); }
  .styles { display:flex; gap:8px; padding:10px 14px; background:#fff; overflow-x:auto; z-index:500;
    border-bottom:1px solid var(--line); flex-shrink:0; }
  .sbtn { flex-shrink:0; padding:9px 16px; border:1.5px solid var(--line); border-radius:11px; background:#fff;
    font-size:13.5px; font-weight:700; font-family:inherit; color:var(--ink); cursor:pointer; white-space:nowrap; }
  .sbtn.on { background:var(--sky); border-color:var(--sky-dark); }
  #map { flex:1; min-height:0; background:#e8eef3; }
  .panel { background:#fff; padding:12px 16px 16px; box-shadow:0 -2px 14px rgba(0,0,0,.09); z-index:500; flex-shrink:0; }
  .name { background:#FFF9E8; border:1.5px solid #FFE3B0; border-radius:11px; padding:10px 13px;
    font-size:13.5px; font-weight:700; text-align:center; margin-bottom:9px; }
  .hint { font-size:11.5px; color:var(--muted); line-height:1.6; text-align:center; }
  .nav-arrow { transform-origin:50% 50%; }
  .locate { position:absolute; bottom:16px; left:16px; z-index:600; width:46px; height:46px;
    background:#fff; border:none; border-radius:50%; box-shadow:0 3px 12px rgba(0,0,0,.2);
    font-size:21px; cursor:pointer; }
  .maprap { position:relative; flex:1; min-height:0; display:flex; }
  .maprap #map { flex:1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🗺️ أي شكل تريد؟</h1>
    <p>اضغط الأرقام فوق وقلّي أي واحد يعجبك</p>
  </header>
  <div class="styles" id="styles"></div>
  <div class="maprap">
    <div id="map"></div>
    <button class="locate" onclick="goToMe()" title="موقعي">◎</button>
  </div>
  <div class="panel">
    <div class="name" id="sname">—</div>
    <div class="hint">كبّر وصغّر وتنقّل بالخريطة — شوف الأسماء والشوارع والحدائق</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script>
/* ⚙️ إضافة النص من اليمين لليسار — بدونها العربي يطلع مقلوب ومفكك
   ("بيسملا" بدل "المسيب"). لازم تنحمّل قبل ما تنبني الخريطة. */
if (window.maplibregl && maplibregl.getRTLTextPluginStatus &&
    maplibregl.getRTLTextPluginStatus() === 'unavailable') {
  maplibregl.setRTLTextPlugin(
    'https://cdn.jsdelivr.net/npm/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js',
    null, true);
}

const MUSAYYIB = [32.7789, 44.2892];
const map = L.map('map', { zoomControl:false, attributionControl:false }).setView(MUSAYYIB, 16);
L.control.zoom({ position:'topright' }).addTo(map);

/* موقعك الحقيقي — أحسن ما تحكم على الخريطة وإنت تشوف شوارعك اللي تعرفها */
let me = null, myLatLng = null;
function drawMe(lat, lng) {
  myLatLng = [lat, lng];
  const icon = L.divIcon({ className:'', iconSize:[0,0],
    html:`<div class="nav-arrow" style="transform:translate(-50%,-50%)">
      <svg width="42" height="42" viewBox="0 0 46 46">
        <circle cx="23" cy="23" r="21" fill="#2BA9E0" stroke="#fff" stroke-width="3"/>
        <circle cx="23" cy="23" r="7" fill="#fff"/></svg></div>` });
  if (me) me.setLatLng(myLatLng).setIcon(icon);
  else me = L.marker(myLatLng, { interactive:false, icon }).addTo(map);
}
function goToMe() {
  if (myLatLng) return map.setView(myLatLng, Math.max(map.getZoom(), 16), { animate:true });
  map.setView(MUSAYYIB, 16);
}
if (navigator.geolocation) {
  navigator.geolocation.watchPosition(
    (p) => {
      const first = !myLatLng;
      drawMe(p.coords.latitude, p.coords.longitude);
      if (first) map.setView(myLatLng, 16);      // أول مرة بس — بعدين ما نزعجه وهو يتنقل
    },
    () => {},
    { enableHighAccuracy:true, maximumAge:5000, timeout:10000 }
  );
}

/* نجبر الأسماء تطلع بالعربي بس.
   نمط liberty يعرض الاسمين سوا (Al Misiab + المصيب)، وإحنا نريد العربي لحاله. */
function forceArabic(m) {
  let layers = [];
  try { layers = m.getStyle().layers || []; } catch (e) { return; }
  for (const l of layers) {
    if (!l.layout || !l.layout['text-field']) continue;
    try {
      m.setLayoutProperty(l.id, 'text-field',
        ['coalesce', ['get','name:ar'], ['get','name'], ['get','name:latin']]);
    } catch (e) {}
  }
}

/* ألوان على طراز Baly — نمط Bright خلفيته بيج/رصاصي والأخضر باهت،
   فنعيد تلوينه وقت التشغيل: خلفية بيضاء، حدائق خضراء واضحة،
   شوارع بيضاء بحواف رمادية فاتحة، مي أزرق صافي. */
const BALY = {
  bg:        '#F4F6F7',
  green:     '#C2E6BC',
  greenDark: '#A3D69C',
  water:     '#A8D5EF',
  road:      '#FFFFFF',
  roadMain:  '#FFFFFF',
  casing:    '#E2E5E8',
  building:  '#EBEDEF',
};

function balyColors(m) {
  const set = (id, prop, val) => { try { m.setPaintProperty(id, prop, val); } catch (e) {} };
  let layers = [];
  try { layers = m.getStyle().layers || []; } catch (e) { return; }

  for (const l of layers) {
    const id = l.id;
    if (l.type === 'background') { set(id, 'background-color', BALY.bg); continue; }

    if (/park|grass|wood|landcover-(grass|wood)/i.test(id) && l.type === 'fill') {
      set(id, 'fill-color', /wood/i.test(id) ? BALY.greenDark : BALY.green);
      set(id, 'fill-opacity', 1);
      continue;
    }
    if (/^water|waterway/i.test(id)) {
      set(id, l.type === 'fill' ? 'fill-color' : 'line-color', BALY.water);
      continue;
    }
    if (/^building/i.test(id)) { set(id, 'fill-color', BALY.building); continue; }

    // الشوارع: الحواف رمادي فاتح، والوسط أبيض — مثل Baly
    if (l.type === 'line' && /(road|motorway|trunk|primary|secondary|tertiary|minor|service|track|link)/i.test(id)) {
      set(id, 'line-color', /casing/i.test(id) ? BALY.casing : BALY.road);
      continue;
    }
    // المساحات الملونة الزائدة (مدارس، مستشفيات، سكني) نهدّيها حتى ما تشوّش
    if (/^landuse/i.test(id) && l.type === 'fill') { set(id, 'fill-opacity', 0.35); }
  }
}

let current = null;

function vector(url, baly) {
  return () => {
    const gl = L.maplibreGL({ style: url });
    gl.on('add', () => {
      const m = gl.getMaplibreMap();
      const apply = () => { forceArabic(m); if (baly) balyColors(m); };
      m.on('styledata', apply);
      if (m.isStyleLoaded && m.isStyleLoaded()) apply();
    });
    return gl;
  };
}

const OFM = 'https://tiles.openfreemap.org/styles/';
const VT  = 'https://tiles.versatiles.org/assets/styles/';

/* مفتاح MapTiler يجي من الرابط (?key=...) مو مكتوب بالكود —
   المستودع عام على GitHub والبوتات تلقط المفاتيح منه. */
const MT_KEY = new URLSearchParams(location.search).get('key') || '';
const mt = (style) => `https://api.maptiler.com/maps/${style}/style.json?key=${MT_KEY}&language=ar`;

const STYLES = [
  { n:'١', name:'١ — الحالي (OpenStreetMap)', build(){
      return L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 }); } },
  { n:'٢', name:'٢ — Liberty', build: vector(OFM + 'liberty') },
  { n:'٣', name:'٣ — Bright (حدائق خضر واضحة)', build: vector(OFM + 'bright') },
  { n:'٤', name:'٤ — Positron (فاتح وهادئ)', build: vector(OFM + 'positron') },
  { n:'٥', name:'٥ — Colorful', build: vector(VT + 'colorful/style.json') },
  { n:'٦', name:'٦ — Neutrino (بسيط جداً)', build: vector(VT + 'neutrino/style.json') },
  { n:'⭐', name:'⭐ — ألوان Baly (مجاني)', build: vector(OFM + 'bright', true) },
];

// أنماط MapTiler — تبيّن بس إذا المفتاح بالرابط
if (MT_KEY) {
  STYLES.push(
    { n:'٧', name:'٧ — MapTiler Streets (الأقرب لـBaly)', build: vector(mt('streets-v2')) },
    { n:'٨', name:'٨ — MapTiler Bright', build: vector(mt('bright-v2')) },
    { n:'٩', name:'٩ — MapTiler Basic', build: vector(mt('basic-v2')) },
  );
}

function pick(i) {
  const s = STYLES[i];
  if (current) map.removeLayer(current);
  current = s.build().addTo(map);
  document.getElementById('sname').textContent = s.name;
  document.querySelectorAll('.sbtn').forEach((b,j) => b.classList.toggle('on', i===j));
}

document.getElementById('styles').innerHTML = STYLES.map((s,i) =>
  `<button class="sbtn" onclick="pick(${i})">${s.n}</button>`).join('');

pick(6);   // نبدي بألوان Baly   // نبدي بالأقرب لـBaly
</script>
</body>
</html>
