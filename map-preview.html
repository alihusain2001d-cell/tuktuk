<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>جايك — تجربة الخريطة</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Segoe UI',Tahoma,sans-serif; }
  :root { --ink:#1A1A1A; --sky:#FFC800; --sky-dark:#E0AC00; --line:#EDE7DA; --muted:#8A8270; }
  html,body { height:100%; background:#fff; color:var(--ink); overflow:hidden; }
  #app { height:100vh; display:flex; flex-direction:column; }
  header { background:#fff; padding:11px 16px; box-shadow:0 1px 10px rgba(0,0,0,.08); z-index:500; flex-shrink:0; }
  header h1 { font-size:15.5px; margin-bottom:2px; }
  header p { font-size:11.5px; color:var(--muted); }
  .styles { display:flex; gap:8px; padding:10px 14px; background:#fff; overflow-x:auto; z-index:500;
    border-bottom:1px solid var(--line); flex-shrink:0; }
  .sbtn { flex-shrink:0; padding:9px 16px; border:1.5px solid var(--line); border-radius:11px; background:#fff;
    font-size:13.5px; font-weight:700; font-family:inherit; color:var(--ink); cursor:pointer; white-space:nowrap; }
  .sbtn.on { background:var(--sky); border-color:var(--sky-dark); }
  #map { flex:1; min-height:0; background:#e8eef3; }
  .panel { background:#fff; padding:12px 16px 16px; box-shadow:0 -2px 14px rgba(0,0,0,.09); z-index:500; flex-shrink:0; }
  .name { background:#FFF9E8; border:1.5px solid #FFE3B0; border-radius:11px; padding:10px 13px;
    font-size:13.5px; font-weight:700; text-align:center; margin-bottom:9px; }
  .hint { font-size:11.5px; color:var(--muted); line-height:1.6; text-align:center; }
  .nav-arrow { transform-origin:50% 50%; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🗺️ أي شكل تريد؟</h1>
    <p>جرّب الاثنين وقلّي الرقم</p>
  </header>
  <div class="styles" id="styles"></div>
  <div id="map"></div>
  <div class="panel">
    <div class="name" id="sname">—</div>
    <div class="hint">كبّر وصغّر وتنقّل بالخريطة — شوف الأسماء والشوارع والحدائق</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script>
const MUSAYYIB = [32.7789, 44.2892];
const map = L.map('map', { zoomControl:false, attributionControl:false }).setView(MUSAYYIB, 16);
L.control.zoom({ position:'topright' }).addTo(map);

// سهم السائق حتى تشوف الشكل كامل
L.marker(MUSAYYIB, { interactive:false, icon: L.divIcon({ className:'', iconSize:[0,0],
  html:`<div class="nav-arrow" style="transform:translate(-50%,-50%) rotate(35deg)">
    <svg width="42" height="42" viewBox="0 0 46 46">
      <circle cx="23" cy="23" r="21" fill="#2BA9E0" stroke="#fff" stroke-width="3"/>
      <path d="M23 9 L32 31 L23 25.5 L14 31 Z" fill="#fff"/></svg></div>` }) }).addTo(map);

/* نجبر الأسماء تطلع بالعربي بس.
   نمط liberty يعرض الاسمين سوا (Al Misiab + المصيب)، وإحنا نريد العربي لحاله. */
function forceArabic(m) {
  let layers = [];
  try { layers = m.getStyle().layers || []; } catch (e) { return; }
  for (const l of layers) {
    if (!l.layout || !l.layout['text-field']) continue;
    try {
      m.setLayoutProperty(l.id, 'text-field',
        ['coalesce', ['get','name:ar'], ['get','name'], ['get','name:latin']]);
    } catch (e) {}
  }
}

let current = null;
const STYLES = [
  { id:'osm',  name:'١ — الحالي (OpenStreetMap)', build(){
      return L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 }); } },
  { id:'vec',  name:'٢ — الجديد (نفس شكل Baly)', build(){
      const gl = L.maplibreGL({ style:'https://tiles.openfreemap.org/styles/liberty' });
      gl.on('add', () => {
        const m = gl.getMaplibreMap();
        m.on('styledata', () => forceArabic(m));
        if (m.isStyleLoaded && m.isStyleLoaded()) forceArabic(m);
      });
      return gl; } },
];

function pick(i) {
  const s = STYLES[i];
  if (current) map.removeLayer(current);
  current = s.build().addTo(map);
  document.getElementById('sname').textContent = s.name;
  document.querySelectorAll('.sbtn').forEach((b,j) => b.classList.toggle('on', i===j));
}

document.getElementById('styles').innerHTML = STYLES.map((s,i) =>
  `<button class="sbtn" onclick="pick(${i})">${'١٢'[i]} ${s.id==='osm'?'الحالي':'الجديد'}</button>`).join('');
pick(1);   // نبدي بالجديد
</script>
</body>
</html>
